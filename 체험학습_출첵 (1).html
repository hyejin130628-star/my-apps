<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체험학습 출석체크</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .status-btn { transition: all 0.2s ease-in-out; }
        .spinner { width:20px;height:20px;border:2px solid #e0e0e0;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px; }
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
<div class="container mx-auto p-4 md:p-8 max-w-5xl">

    <header class="text-center mb-8">
        <h1 class="text-4xl font-bold text-indigo-600">혜진쌤의 스마트 출석부</h1>
        <p class="text-gray-500 mt-2">날짜를 선택하고, 학생들의 상태를 간편하게 기록하세요.</p>
    </header>

    <!-- 선생님 이름 입력 -->
    <div class="bg-white p-6 rounded-2xl shadow-lg mb-6">
        <div class="flex items-end gap-4">
            <div class="flex-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">선생님 이름 <span class="text-gray-400 text-xs">(저장 구분용 — 예: 혜진, 수학김선생)</span></label>
                <input type="text" id="teacher-name" placeholder="이름 입력 후 Enter"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    onkeydown="if(event.key==='Enter')lockTeacher()">
            </div>
            <button onclick="lockTeacher()" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-5 rounded-lg">확인</button>
        </div>
        <div id="teacher-locked" class="hidden mt-3 flex items-center gap-2 text-indigo-600 font-medium text-sm">
            <span id="teacher-locked-name"></span>
            <button onclick="unlockTeacher()" class="text-xs text-gray-400 underline ml-2">변경</button>
        </div>
    </div>

    <!-- 출석부 설정 -->
    <div id="main-section" class="hidden">
        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8">
            <div class="grid md:grid-cols-2 gap-6 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">날짜 선택</label>
                    <input type="date" id="class-date" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">수업/활동명</label>
                    <input type="text" id="class-title" placeholder="예: 2학기 현장 체험학습"
                        class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">학생 명단 (한 줄에 한 명씩)</label>
                <textarea id="student-names" rows="6"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    placeholder="김민준&#10;이서연&#10;박도윤&#10;..."></textarea>
            </div>
            <div class="flex gap-3 mt-4">
                <button id="generate-btn" onclick="generateList()"
                    class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg shadow-md">
                    출석부 생성하기
                </button>
                <button onclick="loadAttendance()"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-5 rounded-lg shadow-md text-sm">
                    🔄 저장된 불러오기
                </button>
            </div>
            <div id="save-status" class="mt-3 text-sm text-center text-gray-400"></div>
        </div>

        <!-- 현황판 -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8 text-center">
            <div class="bg-green-100 p-4 rounded-xl shadow">
                <p class="text-sm md:text-base font-semibold text-green-800">출석(티켓배부)</p>
                <p id="present-count" class="text-3xl font-bold text-green-600">0</p>
            </div>
            <div class="bg-red-100 p-4 rounded-xl shadow">
                <p class="text-sm md:text-base font-semibold text-red-800">결석</p>
                <p id="absent-count" class="text-3xl font-bold text-red-600">0</p>
            </div>
            <div class="bg-yellow-100 p-4 rounded-xl shadow">
                <p class="text-sm md:text-base font-semibold text-yellow-800">지각</p>
                <p id="late-count" class="text-3xl font-bold text-yellow-600">0</p>
            </div>
            <div class="bg-purple-100 p-4 rounded-xl shadow">
                <p class="text-sm md:text-base font-semibold text-purple-800">종례확인</p>
                <p id="checked-count" class="text-3xl font-bold text-purple-600">0</p>
            </div>
            <div class="bg-gray-200 p-4 rounded-xl shadow">
                <p class="text-sm md:text-base font-semibold text-gray-800">미확인</p>
                <p id="pending-count" class="text-3xl font-bold text-gray-600">0</p>
            </div>
        </div>

        <!-- 학생 목록 -->
        <div id="student-list-container" class="space-y-3"></div>
    </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhyoUxB2TjzGTtDfSTPTdFlrhpuqeb6ksicWFbNMU82Tjrc7rTt3y0ObFwxGg_Z23P/exec';

let students = [];
let teacherName = '';
let saveTimer = null;

// 오늘 날짜 기본값
const today = new Date();
document.getElementById('class-date').value = today.toISOString().split('T')[0];

// 선생님 이름 확정
function lockTeacher() {
    const name = document.getElementById('teacher-name').value.trim();
    if (!name) { alert('선생님 이름을 입력해주세요.'); return; }
    teacherName = name;
    document.getElementById('teacher-locked-name').textContent = `👤 ${name} 선생님으로 저장됩니다`;
    document.getElementById('teacher-locked').classList.remove('hidden');
    document.getElementById('teacher-name').closest('.flex').classList.add('hidden');
    document.getElementById('main-section').classList.remove('hidden');
}
function unlockTeacher() {
    teacherName = '';
    document.getElementById('teacher-locked').classList.add('hidden');
    document.getElementById('teacher-name').closest('.flex').classList.remove('hidden');
    document.getElementById('main-section').classList.add('hidden');
    document.getElementById('teacher-name').value = '';
}

// 출석부 생성
function generateList() {
    const names = document.getElementById('student-names').value.split('\n').filter(n => n.trim());
    if (!names.length) { alert('학생 명단을 입력해주세요.'); return; }
    students = names.map((name, i) => ({ id: i, name: name.trim(), status: 'pending' }));
    renderStudentList();
    setSaveStatus('새 출석부가 생성됐어요. 상태 변경 시 자동 저장됩니다.');
}

// 저장된 출석부 불러오기
async function loadAttendance() {
    if (!teacherName) { alert('선생님 이름을 먼저 입력해주세요.'); return; }
    const date = document.getElementById('class-date').value;
    if (!date) { alert('날짜를 선택해주세요.'); return; }
    setSaveStatus('불러오는 중...');
    try {
        const res = await fetch(`${GAS_URL}?action=readAttendance&teacher=${encodeURIComponent(teacherName)}&date=${date}`);
        const data = await res.json();
        if (!data.students || !data.students.length) {
            setSaveStatus('저장된 출석부가 없어요. 학생 명단을 입력하고 생성해주세요.');
            return;
        }
        students = data.students;
        if (data.title) document.getElementById('class-title').value = data.title;
        document.getElementById('student-names').value = students.map(s => s.name).join('\n');
        renderStudentList();
        setSaveStatus(`✅ 불러오기 완료! (${date} / ${teacherName} 선생님)`);
    } catch(e) {
        setSaveStatus('❌ 불러오기 실패. 네트워크를 확인해주세요.');
    }
}

// 자동 저장 (상태 변경 후 1.5초 뒤)
function autoSave() {
    clearTimeout(saveTimer);
    setSaveStatus('저장 중...');
    saveTimer = setTimeout(async () => {
        if (!teacherName) return;
        const date = document.getElementById('class-date').value;
        const title = document.getElementById('class-title').value;
        if (!date) return;
        try {
            await fetch(`${GAS_URL}?action=writeAttendance&teacher=${encodeURIComponent(teacherName)}&date=${date}`, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ students, title, date, teacher: teacherName })
            });
            setSaveStatus(`✅ 자동 저장됨 (${new Date().toLocaleTimeString('ko-KR')})`);
        } catch(e) {
            setSaveStatus('❌ 저장 실패');
        }
    }, 1500);
}

function setSaveStatus(msg) {
    document.getElementById('save-status').textContent = msg;
}

// 학생 목록 렌더링
function renderStudentList() {
    const container = document.getElementById('student-list-container');
    container.innerHTML = '';
    students.forEach(student => {
        const row = document.createElement('div');
        row.className = `bg-white p-3 md:p-4 rounded-lg shadow-sm flex flex-col md:flex-row items-center justify-between transition-colors duration-300 ${getStatusColor(student.status)}`;
        row.dataset.id = student.id;
        row.innerHTML = `
            <span class="font-medium text-lg mb-2 md:mb-0">${student.name}</span>
            <div class="flex space-x-1 md:space-x-2">
                <button class="status-btn px-2 py-2 w-24 rounded-md text-sm font-semibold ${student.status==='present'?'bg-green-500 text-white':'bg-gray-200 hover:bg-green-200'}" data-status="present">출석(티켓)</button>
                <button class="status-btn px-2 py-2 w-16 rounded-md text-sm font-semibold ${student.status==='absent'?'bg-red-500 text-white':'bg-gray-200 hover:bg-red-200'}" data-status="absent">결석</button>
                <button class="status-btn px-2 py-2 w-16 rounded-md text-sm font-semibold ${student.status==='late'?'bg-yellow-500 text-white':'bg-gray-200 hover:bg-yellow-200'}" data-status="late">지각</button>
                <button class="status-btn px-2 py-2 w-20 rounded-md text-sm font-semibold ${student.status==='checked'?'bg-purple-500 text-white':'bg-gray-200 hover:bg-purple-200'}" data-status="checked">종례확인</button>
            </div>`;
        container.appendChild(row);
    });
    updateSummary();
}

function getStatusColor(status) {
    const map = { present:'bg-green-50', absent:'bg-red-50', late:'bg-yellow-50', checked:'bg-purple-50' };
    return map[status] || 'bg-white';
}

function updateSummary() {
    const c = (s) => students.filter(x => x.status === s).length;
    document.getElementById('present-count').textContent = c('present');
    document.getElementById('absent-count').textContent = c('absent');
    document.getElementById('late-count').textContent = c('late');
    document.getElementById('checked-count').textContent = c('checked');
    document.getElementById('pending-count').textContent = students.length - c('present') - c('absent') - c('late') - c('checked');
}

// 상태 변경 이벤트
document.getElementById('student-list-container').addEventListener('click', (e) => {
    if (!e.target.classList.contains('status-btn')) return;
    const newStatus = e.target.dataset.status;
    const row = e.target.closest('[data-id]');
    const id = parseInt(row.dataset.id);
    const student = students.find(s => s.id === id);
    student.status = (student.status === newStatus) ? 'pending' : newStatus;
    renderStudentList();
    autoSave();
});
</script>
</body>
</html>
