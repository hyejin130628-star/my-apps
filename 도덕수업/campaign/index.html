<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕊 학교폭력예방 캠페인 스케줄러</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; }
.container { max-width: 600px; margin: 0 auto; padding: 24px 16px 80px; }
header { text-align: center; margin-bottom: 24px; }
header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
header p { font-size: 13px; color: #666; }
.tab-bar { display: flex; gap: 4px; background: #e8e6e0; border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.tab { flex: 1; padding: 8px; font-size: 14px; border: none; background: transparent; border-radius: 8px; cursor: pointer; color: #666; font-weight: 500; transition: all .15s; }
.tab.active { background: #fff; color: #1a1a1a; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.section-label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.class-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.class-btn { padding: 16px 8px; border: 1.5px solid #e8e6e0; border-radius: 10px; background: #fff; cursor: pointer; font-size: 15px; font-weight: 600; color: #1a1a1a; transition: all .15s; }
.class-btn:hover { border-color: #aaa; background: #fafafa; }
.class-btn.selected { border-color: #185FA5; background: #E6F1FB; color: #185FA5; }
.group-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
.group-btn { padding: 12px 4px; border: 1.5px solid #e8e6e0; border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px; font-weight: 600; color: #1a1a1a; transition: all .15s; line-height: 1.5; }
.group-btn:hover { border-color: #aaa; }
.group-btn.selected { border-color: #185FA5; background: #E6F1FB; color: #185FA5; }
.group-btn.scheduled { border-color: #BA7517; background: #FAEEDA; color: #633806; }
.group-btn.all-done { border-color: #3B6D11; background: #EAF3DE; color: #27500A; }
.btn-primary { display: block; width: 100%; padding: 14px; background: #185FA5; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .15s; margin-top: 4px; font-family: inherit; }
.btn-primary:hover { background: #0C447C; }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary { display: block; width: 100%; padding: 12px; background: #fff; color: #333; border: 1.5px solid #e0ddd6; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; margin-top: 8px; font-family: inherit; }
.btn-secondary:hover { background: #f5f4f0; }
.btn-reset { display: block; width: 100%; padding: 12px; background: #fff; color: #A32D2D; border: 1.5px solid #f5c6c6; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; margin-top: 8px; font-family: inherit; }
.btn-reset:hover { background: #FCEBEB; }
.btn-edit { display: block; width: 100%; padding: 12px; background: #fff; color: #185FA5; border: 1.5px solid #185FA5; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; margin-top: 8px; font-family: inherit; }
.btn-edit:hover { background: #E6F1FB; }
.names-textarea { width: 100%; border: 1.5px solid #e0ddd6; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 70px; outline: none; transition: border-color .15s; }
.names-textarea:focus { border-color: #185FA5; }
.calendar { margin-bottom: 12px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav { background: #f5f4f0; border: none; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; color: #333; transition: background .12s; font-family: inherit; }
.cal-nav:hover { background: #e8e6e0; }
.cal-title { font-size: 15px; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-day-label { font-size: 11px; color: #999; text-align: center; padding: 4px 0; font-weight: 600; }
.cal-day { height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1.5px solid transparent; transition: all .12s; }
.cal-day:hover:not(.empty):not(.past):not(.weekend) { background: #f0f0f0; }
.cal-day.selected { background: #185FA5; color: #fff; border-color: #185FA5; font-weight: 700; }
.cal-day.today { border-color: #185FA5; font-weight: 700; }
.cal-day.past, .cal-day.weekend { color: #ccc; cursor: not-allowed; }
.cal-day.empty { cursor: default; }
.time-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.loc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.slot-btn { padding: 12px; border: 1.5px solid #e0ddd6; border-radius: 10px; background: #fff; cursor: pointer; text-align: left; transition: all .12s; width: 100%; font-family: inherit; }
.slot-btn:hover:not(:disabled) { border-color: #aaa; background: #fafafa; }
.slot-btn.selected { border-color: #185FA5; background: #E6F1FB; }
.slot-btn:disabled { opacity: .45; cursor: not-allowed; }
.slot-label { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.slot-btn.selected .slot-label { color: #185FA5; }
.slot-time { font-size: 12px; color: #888; margin-top: 2px; }
.slot-btn.selected .slot-time { color: #185FA5; }
.full-badge { display: inline-block; font-size: 10px; background: #FCEBEB; color: #A32D2D; border-radius: 4px; padding: 1px 5px; margin-left: 6px; font-weight: 600; }
.avail-badge { display: inline-block; font-size: 10px; background: #EAF3DE; color: #3B6D11; border-radius: 4px; padding: 1px 5px; margin-left: 6px; font-weight: 600; }
.session-done-card { border-radius: 10px; padding: 14px; background: #EAF3DE; border: 1.5px solid #3B6D11; margin-bottom: 10px; }
.session-done-label { font-size: 11px; font-weight: 700; color: #3B6D11; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.session-done-date { font-size: 15px; font-weight: 700; color: #1a1a1a; }
.session-done-detail { font-size: 13px; color: #3B6D11; margin-top: 2px; }
.change-btn { background: none; border: none; font-size: 12px; color: #999; cursor: pointer; margin-top: 8px; padding: 0; font-family: inherit; }
.change-btn:hover { color: #A32D2D; }
.exec-row { display: flex; gap: 8px; margin-top: 10px; }
.exec-btn { flex: 1; padding: 8px; border: 1.5px solid #e0ddd6; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; color: #888; transition: all .15s; font-family: inherit; }
.exec-btn.yes { border-color: #185FA5; background: #E6F1FB; color: #185FA5; }
.exec-btn.no { border-color: #A32D2D; background: #FCEBEB; color: #A32D2D; }
.member-check-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.member-check-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #f5f4f0; border-radius: 8px; cursor: pointer; transition: background .12s; }
.member-check-item:hover { background: #ece9e4; }
.member-check-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: #185FA5; flex-shrink: 0; }
.member-check-item span { font-size: 14px; cursor: pointer; flex: 1; }
.member-check-item.checked span { color: #185FA5; font-weight: 600; }
.member-check-item.checked { background: #E6F1FB; }
.step-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }
.step-dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; color: #999; }
.step-dot.active { background: #185FA5; color: #fff; border-color: #185FA5; }
.step-dot.done { background: #1D9E75; color: #fff; border-color: #1D9E75; }
.step-line { flex: 1; height: 1px; background: #e0ddd6; }
.step-text { font-size: 12px; color: #888; }
.back-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: #888; margin-bottom: 14px; padding: 0; font-family: inherit; }
.back-btn:hover { color: #333; }
.view { display: none; }
.view.active { display: block; }
.success-wrap { text-align: center; padding: 28px 0 16px; }
.success-icon { font-size: 52px; margin-bottom: 10px; }
.success-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.success-sub { font-size: 13px; color: #666; }
.sess-result { background: #f5f4f0; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
.admin-stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 14px; }
.stat-box { background: #f5f4f0; border-radius: 10px; padding: 10px 6px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 700; }
.stat-lbl { font-size: 10px; color: #888; margin-top: 2px; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; padding: 4px 6px 8px; border-bottom: 1px solid #e8e6e0; text-align: left; }
.admin-table td { padding: 8px 6px; border-bottom: 1px solid #f0ede6; vertical-align: middle; }
.admin-table tr:last-child td { border-bottom: none; }
.admin-table tr:hover td { background: #fafaf8; cursor: pointer; }
.chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
.chip-done { background: #EAF3DE; color: #27500A; }
.chip-partial { background: #FAEEDA; color: #633806; }
.chip-none { background: #f0ede6; color: #999; }
.chip-exec { background: #E6F1FB; color: #185FA5; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 20px 20px 0 0; padding: 20px 20px 36px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
.modal-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
.modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.modal-names { font-size: 13px; color: #666; margin-bottom: 14px; }
.modal-close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; margin-top: -4px; font-family: inherit; }
.modal-sess-card { border: 1.5px solid #e0ddd6; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.modal-sess-card.exec-yes { border-color: #185FA5; background: #f0f6ff; }
.modal-sess-card.exec-no { border-color: #e09a9a; background: #fff8f8; }
.modal-sess-num { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 6px; }
.modal-sess-date { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.modal-sess-detail { font-size: 13px; color: #555; margin-bottom: 10px; }
.teacher-exec-row { display: flex; gap: 8px; margin-bottom: 10px; }
.teacher-exec-btn { flex: 1; padding: 8px; border: 1.5px solid #e0ddd6; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; color: #888; transition: all .15s; font-family: inherit; }
.teacher-exec-btn.yes { border-color: #185FA5; background: #185FA5; color: #fff; }
.teacher-exec-btn.no { border-color: #A32D2D; background: #A32D2D; color: #fff; }
.modal-member-list { display: flex; flex-wrap: wrap; gap: 6px; }
.member-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.member-tag.present { background: #E6F1FB; color: #185FA5; }
.member-tag.absent { background: #f0ede6; color: #aaa; text-decoration: line-through; }
.reset-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.reset-modal-overlay.open { display: flex; }
.reset-modal { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
.reset-modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.reset-modal p { font-size: 13px; color: #666; margin-bottom: 16px; line-height: 1.6; }
.class-reset-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
.class-reset-btn { padding: 14px 8px; border: 1.5px solid #e8e6e0; border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px; font-weight: 600; color: #1a1a1a; transition: all .15s; font-family: inherit; }
.class-reset-btn:hover { border-color: #A32D2D; background: #FCEBEB; color: #A32D2D; }
.btn-reset-all { display: block; width: 100%; padding: 12px; background: #A32D2D; color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 8px; font-family: inherit; }
.btn-reset-all:hover { background: #7a1f1f; }
.attend-count { font-size: 12px; color: #185FA5; font-weight: 600; margin-top: 6px; text-align: right; }
.loading-bar { text-align:center; padding: 40px; font-size: 14px; color: #888; }
.sync-badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; margin-left:8px; font-weight:600; }
.sync-ok { background:#EAF3DE; color:#27500A; }
.sync-fail { background:#FCEBEB; color:#A32D2D; }
</style>
</head>
<body>
<div class="container">

<div id="view-home" class="view active">
  <header>
    <h1>🕊 학교폭력예방 캠페인</h1>
    <p>반과 조를 선택하고 3회 캠페인 일정을 신청하세요</p>
    <p style="font-size:11px;margin-top:4px;" id="sync-status"></p>
  </header>
  <div class="tab-bar">
    <button class="tab active" id="tab-btn-student">학생 신청</button>
    <button class="tab" id="tab-btn-admin">선생님 보기</button>
  </div>

  <div id="tab-student">
    <div class="card">
      <div class="section-label">반 선택</div>
      <div class="class-grid" id="class-grid"></div>
    </div>
    <div class="card" id="group-card" style="display:none">
      <div class="section-label" id="group-label">조 선택</div>
      <div class="group-grid" id="group-grid"></div>
    </div>
    <button class="btn-primary" id="btn-start" disabled>일정 신청하기 →</button>
  </div>

  <div id="tab-admin" style="display:none">
    <div class="card">
      <div class="section-label">전체 현황 <span id="last-sync" style="font-size:10px;color:#aaa;font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px;"></span></div>
      <div class="admin-stat-grid">
        <div class="stat-box"><div class="stat-num" id="stat-exec" style="color:#185FA5">0</div><div class="stat-lbl">시행완료</div></div>
        <div class="stat-box"><div class="stat-num" id="stat-done" style="color:#1D9E75">0</div><div class="stat-lbl">일정완료</div></div>
        <div class="stat-box"><div class="stat-num" id="stat-partial" style="color:#BA7517">0</div><div class="stat-lbl">진행중</div></div>
        <div class="stat-box"><div class="stat-num" id="stat-none" style="color:#aaa">63</div><div class="stat-lbl">미신청</div></div>
      </div>
      <div id="admin-loading" class="loading-bar">⏳ 데이터 불러오는 중...</div>
      <table class="admin-table" id="admin-table" style="display:none">
        <thead><tr><th>반</th><th>조</th><th>조원</th><th>시행</th><th>상태</th></tr></thead>
        <tbody id="admin-list"></tbody>
      </table>
    </div>
    <button class="btn-secondary" id="btn-refresh">🔄 새로고침</button>
    <button class="btn-secondary" id="btn-export">📄 전체 일정 내보내기</button>
    <button class="btn-reset" id="btn-open-reset">🗑 학급별 초기화</button>
  </div>
</div>

<div id="view-schedule" class="view">
  <button class="back-btn" id="back-from-schedule">← 처음으로</button>
  <header style="text-align:left;margin-bottom:16px">
    <h1 id="schedule-title" style="font-size:20px"></h1>
    <p id="schedule-sub" style="font-size:13px;color:#666;margin-top:2px"></p>
  </header>
  <div class="step-bar">
    <div class="step-dot active" id="sd1">1</div>
    <div class="step-line"></div>
    <div class="step-dot" id="sd2">2</div>
    <div class="step-line"></div>
    <div class="step-dot" id="sd3">3</div>
    <div class="step-line"></div>
    <div class="step-dot" id="sd4">4</div>
    <span class="step-text" id="step-label"></span>
  </div>
  <div id="step-names">
    <div class="card">
      <div class="section-label">조원 이름 입력</div>
      <p style="font-size:13px;color:#888;margin-bottom:10px">쉼표(,) 또는 줄바꿈으로 구분해서 입력하세요</p>
      <textarea class="names-textarea" id="names-input" placeholder="예) 김민준, 이서연, 박지우, 최현우"></textarea>
    </div>
    <button class="btn-primary" id="btn-next-names">다음 →</button>
  </div>
  <div id="step-sessions" style="display:none">
    <div id="sessions-container"></div>
    <button class="btn-primary" id="btn-submit" disabled>✅ 신청 완료</button>
  </div>
</div>

<div id="view-mypage" class="view">
  <button class="back-btn" id="back-from-mypage">← 처음으로</button>
  <header style="text-align:left;margin-bottom:16px">
    <h1 id="mypage-title" style="font-size:20px"></h1>
    <p id="mypage-sub" style="font-size:13px;color:#666;margin-top:2px"></p>
  </header>
  <div id="mypage-sessions"></div>
  <button class="btn-primary" id="btn-save-mypage">💾 저장하기</button>
  <button class="btn-edit" id="btn-edit-schedule">✏️ 일정 수정하기</button>
  <button class="btn-secondary" id="back-from-mypage2">← 처음으로</button>
</div>

<div id="view-success" class="view">
  <div class="success-wrap">
    <div class="success-icon">✅</div>
    <div class="success-title">신청 완료!</div>
    <div class="success-sub" id="success-subtitle"></div>
  </div>
  <div class="card">
    <div class="section-label">신청한 일정</div>
    <div id="success-sessions"></div>
  </div>
  <button class="btn-primary" id="btn-go-mypage">시행여부 / 참여학생 체크하기</button>
  <button class="btn-secondary" id="back-from-success">← 처음으로</button>
</div>

</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <button class="modal-close" id="modal-close-btn">✕</button>
    <h2 id="modal-title"></h2>
    <div class="modal-names" id="modal-names"></div>
    <div id="modal-sessions"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-secondary" style="flex:1;margin-top:0" id="modal-close-btn2">닫기</button>
      <button id="btn-reset-group" style="flex:1;padding:12px;background:#fff;color:#A32D2D;border:1.5px solid #f5c6c6;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">🗑 이 조 초기화</button>
    </div>
  </div>
</div>

<div class="reset-modal-overlay" id="reset-modal-overlay">
  <div class="reset-modal">
    <h3>🗑 학급별 초기화</h3>
    <p>초기화할 반을 선택하세요.<br>해당 반의 모든 조 데이터가 삭제됩니다.</p>
    <div class="class-reset-grid" id="class-reset-grid"></div>
    <button class="btn-reset-all" id="btn-reset-all">⚠️ 전체 초기화 (63팀)</button>
    <button class="btn-secondary" style="margin-top:0" id="reset-modal-cancel">취소</button>
  </div>
</div>

<script>
(function(){

const API = 'https://script.google.com/macros/s/AKfycbysj-1UpDeUsEH16YPx6lxv-eTjkIGgxE4wSEwHpyykZBnk0il-EiXimwYhptY9o4Jh/exec';
const LOCATIONS  = { morning:['정문','후문'], lunch:['중앙현관 앞마당'], after:['정문','후문'] };
const TIME_LABELS = { morning:'🌅 아침 등굣길', lunch:'🌞 점심시간', after:'🌇 방과후 하굣길' };
const TIME_TIMES  = { morning:'08:20 ~ 08:40', lunch:'12:30 ~ 13:20', after:'15:20 ~ 16:30' };
const MAX_SLOT = 5;
const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const DAYS   = ['일','월','화','수','목','금','토'];

let schedules = {};
let currentModalKey = null;
let S = { cls:null, grp:null, names:'', sessions:blankSessions(), calY:new Date().getFullYear(), calM:new Date().getMonth() };

function blankSessions(){
  return [{date:null,time:null,loc:null,executed:null,presentMembers:[]},{date:null,time:null,loc:null,executed:null,presentMembers:[]},{date:null,time:null,loc:null,executed:null,presentMembers:[]}];
}

/* ── API ── */
async function apiGet(){
  try {
    const res = await fetch(API + '?action=get&t=' + Date.now());
    const text = await res.text();
    const data = JSON.parse(text);
    schedules = data || {};
    document.getElementById('sync-status').innerHTML = '<span class="sync-badge sync-ok">🟢 서버 연결됨</span>';
    document.getElementById('last-sync').textContent = '최근 업데이트: ' + new Date().toLocaleTimeString('ko-KR');
    return true;
  } catch(e) {
    document.getElementById('sync-status').innerHTML = '<span class="sync-badge sync-fail">🔴 오프라인 모드</span>';
    return false;
  }
}

async function apiSet(key, value){
  try {
    const encoded = encodeURIComponent(JSON.stringify(value));
    const url = API + '?action=set&key=' + encodeURIComponent(key) + '&value=' + encoded;
    const res = await fetch(url);
    await res.text();
    return true;
  } catch(e) {
    alert('저장 중 오류가 발생했습니다. 인터넷 연결을 확인해주세요.');
    return false;
  }
}

async function apiDelete(key){
  try {
    const url = API + '?action=set&key=' + encodeURIComponent(key) + '&value=DELETE';
    const res = await fetch(url);
    await res.text();
    return true;
  } catch(e) { return false; }
}

function getSlotCount(date,time,loc){
  let n=0;
  for(let k in schedules) (schedules[k].sessions||[]).forEach(s=>{ if(s.date===date&&s.time===time&&s.loc===loc) n++; });
  return n;
}
function showView(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function myKey(){ return S.cls+'-'+S.grp; }

/* ── 반/조 선택 ── */
function selectClass(c){
  S.cls=c; S.grp=null;
  document.querySelectorAll('.class-btn').forEach(function(b){ b.classList.toggle('selected', parseInt(b.dataset.c)===c); });
  document.getElementById('group-card').style.display='block';
  document.getElementById('group-label').textContent=c+'반 조 선택';
  renderGroups(c);
  document.getElementById('btn-start').disabled=true;
}

function renderGroups(c){
  const grid=document.getElementById('group-grid'); grid.innerHTML='';
  for(let g=1;g<=7;g++){
    const key=c+'-'+g, d=schedules[key];
    const schd=d?d.sessions.filter(s=>s.date).length:0;
    const exec=d?d.sessions.filter(s=>s.executed===true).length:0;
    const btn=document.createElement('button');
    btn.className='group-btn'+(exec>0?' all-done':schd>0?' scheduled':'');
    btn.dataset.g=g;
    const sub=exec>0?'<br><small style="font-size:10px">'+exec+'회 시행</small>':schd>0?'<br><small style="font-size:10px">'+schd+'/3 신청</small>':'';
    btn.innerHTML=g+'조'+sub;
    grid.appendChild(btn);
  }
  grid.addEventListener('click',function(e){
    const b=e.target.closest('.group-btn');
    if(b){ selectGroup(parseInt(b.dataset.g)); }
  });
}

function selectGroup(g){
  S.grp=g;
  document.querySelectorAll('.group-btn').forEach(function(b){ b.classList.toggle('selected', parseInt(b.dataset.g)===g); });
  document.getElementById('btn-start').disabled=false;
}

/* ── 탭 전환 ── */
function switchTab(t){
  document.getElementById('tab-btn-student').classList.toggle('active', t==='student');
  document.getElementById('tab-btn-admin').classList.toggle('active', t==='admin');
  document.getElementById('tab-student').style.display=t==='student'?'block':'none';
  document.getElementById('tab-admin').style.display=t==='admin'?'block':'none';
  if(t==='admin') renderAdmin();
}

/* ── 관리자 뷰 ── */
async function renderAdmin(){
  document.getElementById('admin-loading').style.display='block';
  document.getElementById('admin-table').style.display='none';
  await apiGet();
  document.getElementById('admin-loading').style.display='none';
  document.getElementById('admin-table').style.display='table';

  const tbody=document.getElementById('admin-list'); tbody.innerHTML='';
  let execCnt=0,doneCnt=0,partialCnt=0,noneCnt=0;
  for(let c=1;c<=9;c++) for(let g=1;g<=7;g++){
    const key=c+'-'+g, data=schedules[key];
    const schd=data?data.sessions.filter(s=>s.date).length:0;
    const exec=data?data.sessions.filter(s=>s.executed===true).length:0;
    if(exec>0) execCnt++; else if(schd===3) doneCnt++; else if(schd>0) partialCnt++; else noneCnt++;
    const tr=document.createElement('tr');
    const chip=exec>0?'<span class="chip chip-exec">'+exec+'회 시행</span>':schd===3?'<span class="chip chip-done">신청완료</span>':schd>0?'<span class="chip chip-partial">'+schd+'/3</span>':'<span class="chip chip-none">미신청</span>';
    const execBadge=exec>0?'<span style="font-size:11px;color:#185FA5;font-weight:700">✔ '+exec+'/3</span>':'<span style="font-size:11px;color:#ccc">—</span>';
    tr.innerHTML='<td style="font-weight:700">'+c+'반</td><td>'+g+'조</td><td style="font-size:12px;color:#888;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(data?data.names:'-')+'</td><td>'+execBadge+'</td><td>'+chip+'</td>';
    tr.dataset.key=key;
    tbody.appendChild(tr);
  }
  tbody.addEventListener('click',function(e){ const tr=e.target.closest('tr'); if(tr&&tr.dataset.key) openModal(tr.dataset.key); });
  document.getElementById('stat-exec').textContent=execCnt;
  document.getElementById('stat-done').textContent=doneCnt;
  document.getElementById('stat-partial').textContent=partialCnt;
  document.getElementById('stat-none').textContent=noneCnt;
}

/* ── 관리자 상세 모달 ── */
function openModal(key){
  const data=schedules[key];
  if(!data){ alert('아직 신청하지 않은 조입니다.'); return; }
  currentModalKey=key;
  const parts=key.split('-');
  document.getElementById('modal-title').textContent=parts[0]+'반 '+parts[1]+'조 일정';
  document.getElementById('modal-names').textContent='조원: '+data.names;
  const cont=document.getElementById('modal-sessions'); cont.innerHTML='';
  const members=data.names.split(/[,\n]/).map(function(n){ return n.trim(); }).filter(Boolean);
  data.sessions.forEach(function(s,i){
    const card=document.createElement('div');
    card.className='modal-sess-card'+(s.executed===true?' exec-yes':s.executed===false?' exec-no':'');
    let inner='<div class="modal-sess-num">'+(i+1)+'회차</div>';
    if(s.date){
      inner+='<div class="modal-sess-date">'+s.date+'</div>';
      inner+='<div class="modal-sess-detail">'+TIME_LABELS[s.time]+' ('+TIME_TIMES[s.time]+') &nbsp;📍'+s.loc+'</div>';
      inner+='<div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;margin-bottom:6px">교사 시행 확인</div>';
      inner+='<div class="teacher-exec-row"><button class="teacher-exec-btn'+(s.executed===true?' yes':'')+'" data-key="'+key+'" data-si="'+i+'" data-val="true">✔ 시행 완료</button><button class="teacher-exec-btn'+(s.executed===false?' no':'')+'" data-key="'+key+'" data-si="'+i+'" data-val="false">✕ 미시행</button></div>';
      if(members.length>0){
        inner+='<div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;margin-bottom:6px">참여 학생</div>';
        inner+='<div class="modal-member-list">';
        members.forEach(function(m){ const present=s.presentMembers&&s.presentMembers.includes(m); inner+='<span class="member-tag '+(present?'present':'absent')+'">'+(present?'✓ ':'')+m+'</span>'; });
        inner+='</div>';
      }
    } else {
      inner+='<div style="font-size:13px;color:#aaa">아직 일정이 신청되지 않았습니다</div>';
    }
    card.innerHTML=inner;
    cont.appendChild(card);
  });
  cont.addEventListener('click',function(e){
    const btn=e.target.closest('.teacher-exec-btn');
    if(btn) teacherExec(btn.dataset.key, parseInt(btn.dataset.si), btn.dataset.val==='true');
  });
  document.getElementById('modal-overlay').classList.add('open');
}

async function teacherExec(key,si,val){
  if(!schedules[key]) return;
  schedules[key].sessions[si].executed = schedules[key].sessions[si].executed===val ? null : val;
  await apiSet(key, schedules[key]);
  openModal(key);
}

function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); currentModalKey=null; renderAdmin(); }

async function resetCurrentGroup(){
  if(!currentModalKey) return;
  const parts=currentModalKey.split('-');
  if(!confirm(parts[0]+'반 '+parts[1]+'조의 모든 데이터를 초기화할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
  await apiDelete(currentModalKey);
  delete schedules[currentModalKey];
  closeModal();
}

async function resetClass(c){
  if(!confirm(c+'반 전체(7개 조) 데이터를 초기화할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
  for(let g=1;g<=7;g++){
    const key=c+'-'+g;
    if(schedules[key]){ await apiDelete(key); delete schedules[key]; }
  }
  document.getElementById('reset-modal-overlay').classList.remove('open');
  renderAdmin();
  alert(c+'반 전체가 초기화되었습니다.');
}

async function resetAll(){
  if(!confirm('⚠️ 전체 63팀 데이터를 모두 초기화할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
  for(let k in schedules){ await apiDelete(k); }
  schedules={};
  document.getElementById('reset-modal-overlay').classList.remove('open');
  renderAdmin();
  alert('전체 데이터가 초기화되었습니다.');
}

/* ── 일정 신청 ── */
function goToSchedule(){
  if(!S.cls||!S.grp) return;
  const ex=schedules[myKey()];
  if(ex && ex.sessions.filter(function(s){ return s.date; }).length>0){
    S.names=ex.names;
    S.sessions=JSON.parse(JSON.stringify(ex.sessions));
    showMypage();
    return;
  }
  S.names=ex?ex.names:'';
  S.sessions=ex?JSON.parse(JSON.stringify(ex.sessions)):blankSessions();
  showView('view-schedule');
  document.getElementById('schedule-title').textContent=S.cls+'반 '+S.grp+'조 일정 신청';
  document.getElementById('schedule-sub').textContent='조원 이름과 3회 캠페인 일정을 입력해주세요';
  showStep('names');
}

function showStep(step){
  document.getElementById('step-names').style.display='none';
  document.getElementById('step-sessions').style.display='none';
  if(step==='names'){
    document.getElementById('step-names').style.display='block';
    document.getElementById('names-input').value=S.names;
    setDots(1);
    document.getElementById('step-label').textContent='조원 이름';
  } else {
    document.getElementById('step-sessions').style.display='block';
    setDots(2);
    document.getElementById('step-label').textContent='3회 일정 선택';
    renderSessions();
  }
}

function setDots(active){
  [1,2,3,4].forEach(function(i){
    const d=document.getElementById('sd'+i);
    d.className='step-dot'+(i<active?' done':i===active?' active':'');
    d.textContent=i<active?'✓':String(i);
  });
}

function nextFromNames(){
  const v=document.getElementById('names-input').value.trim();
  if(!v){ alert('조원 이름을 입력해주세요.'); return; }
  S.names=v; showStep('sessions');
}

function renderSessions(){
  const cont=document.getElementById('sessions-container'); cont.innerHTML='';
  S.sessions.forEach(function(sess,i){
    const div=document.createElement('div');
    if(sess.date&&sess.time&&sess.loc){
      div.className='session-done-card';
      div.innerHTML='<div class="session-done-label">'+(i+1)+'회차 ✓</div><div class="session-done-date">'+sess.date+'</div><div class="session-done-detail">'+TIME_LABELS[sess.time]+' ('+TIME_TIMES[sess.time]+')</div><div class="session-done-detail">📍 '+sess.loc+'</div><button class="change-btn" data-si="'+i+'">× 변경하기</button>';
    } else {
      div.className='card';
      div.innerHTML='<div class="section-label">'+(i+1)+'회차 — 일정 선택</div>'+buildPicker(i);
    }
    cont.appendChild(div);
  });
  cont.querySelectorAll('.change-btn').forEach(function(btn){ btn.addEventListener('click',function(){ clearSess(parseInt(this.dataset.si)); }); });
  cont.querySelectorAll('.cal-nav').forEach(function(btn){ btn.addEventListener('click',function(){ calNav(parseInt(this.dataset.si), parseInt(this.dataset.d)); }); });
  cont.querySelectorAll('.cal-day:not(.empty):not(.past):not(.weekend)').forEach(function(el){ el.addEventListener('click',function(){ pickDate(parseInt(this.dataset.si), this.dataset.date); }); });
  cont.querySelectorAll('.slot-btn[data-time]').forEach(function(btn){ btn.addEventListener('click',function(){ if(!this.disabled) pickTime(parseInt(this.dataset.si), this.dataset.time); }); });
  cont.querySelectorAll('.slot-btn[data-loc]').forEach(function(btn){ btn.addEventListener('click',function(){ if(!this.disabled) pickLoc(parseInt(this.dataset.si), this.dataset.loc); }); });
  document.getElementById('btn-submit').disabled=!S.sessions.every(function(s){ return s.date&&s.time&&s.loc; });
}

function buildPicker(si){
  const y=S.calY, m=S.calM;
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  let h='<div class="calendar"><div class="cal-header"><button class="cal-nav" data-si="'+si+'" data-d="-1">‹</button><span class="cal-title">'+y+'년 '+MONTHS[m]+'</span><button class="cal-nav" data-si="'+si+'" data-d="1">›</button></div><div class="cal-grid">';
  DAYS.forEach(function(d){ h+='<div class="cal-day-label">'+d+'</div>'; });
  for(let i=0;i<first;i++) h+='<div class="cal-day empty"></div>';
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m,d), dow=dt.getDay();
    const past=dt<today, wknd=dow===0||dow===6;
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const sel=S.sessions[si].date===ds, isTod=dt.getTime()===today.getTime();
    let cls='cal-day'+(sel?' selected':past||wknd?' past':isTod?' today':'');
    if(past||wknd) h+='<div class="'+cls+'">'+d+'</div>';
    else h+='<div class="'+cls+'" data-si="'+si+'" data-date="'+ds+'">'+d+'</div>';
  }
  h+='</div></div>';
  if(S.sessions[si].date){
    const date=S.sessions[si].date;
    h+='<div class="section-label" style="margin-top:12px">시간대 선택</div><div class="time-list">';
    ['morning','lunch','after'].forEach(function(t){
      const locs=LOCATIONS[t];
      const allFull=locs.every(function(l){ const cnt=getSlotCount(date,t,l); return cnt>=MAX_SLOT; });
      const sel=S.sessions[si].time===t;
      h+='<button class="slot-btn'+(sel?' selected':'')+'" '+(allFull&&!sel?'disabled':'')+' data-si="'+si+'" data-time="'+t+'"><div style="display:flex;justify-content:space-between;align-items:center"><span class="slot-label">'+TIME_LABELS[t]+(allFull&&!sel?'<span class="full-badge">마감</span>':'')+'</span><span class="slot-time">'+TIME_TIMES[t]+'</span></div></button>';
    });
    h+='</div>';
  }
  if(S.sessions[si].date&&S.sessions[si].time){
    const t=S.sessions[si].time, date=S.sessions[si].date;
    h+='<div class="section-label" style="margin-top:4px">장소 선택</div><div class="loc-grid">';
    LOCATIONS[t].forEach(function(l){
      const cnt=getSlotCount(date,t,l), full=cnt>=MAX_SLOT, sel=S.sessions[si].loc===l, rem=MAX_SLOT-cnt;
      h+='<button class="slot-btn'+(sel?' selected':'')+'" '+(full&&!sel?'disabled':'')+' data-si="'+si+'" data-loc="'+l+'"><div class="slot-label">'+l+(full&&!sel?'<span class="full-badge">마감</span>':rem<=2&&!full?'<span class="avail-badge">잔여 '+rem+'</span>':'')+'</div><div class="slot-time">최대 5팀</div></button>';
    });
    h+='</div>';
  }
  return h;
}

function calNav(si,d){ S.calM+=d; if(S.calM<0){S.calM=11;S.calY--;} if(S.calM>11){S.calM=0;S.calY++;} renderSessions(); }
function pickDate(si,d){ S.sessions[si]={date:d,time:null,loc:null,executed:null,presentMembers:[]}; renderSessions(); }
function pickTime(si,t){ S.sessions[si].time=t; S.sessions[si].loc=null; renderSessions(); }
function pickLoc(si,l){ S.sessions[si].loc=l; renderSessions(); }
function clearSess(si){ S.sessions[si]={date:null,time:null,loc:null,executed:null,presentMembers:[]}; renderSessions(); }

async function submitSchedule(){
  const key=myKey();
  const data={names:S.names, sessions:JSON.parse(JSON.stringify(S.sessions))};
  schedules[key]=data;
  const ok=await apiSet(key, data);
  if(!ok) return;
  showView('view-success');
  document.getElementById('success-subtitle').textContent=S.cls+'반 '+S.grp+'조 · 조원 '+S.names.split(/[,\n]/).filter(function(n){ return n.trim(); }).length+'명';
  const cont=document.getElementById('success-sessions'); cont.innerHTML='';
  S.sessions.forEach(function(s,i){
    const d=document.createElement('div'); d.className='sess-result';
    d.innerHTML='<strong>'+(i+1)+'회차</strong> &nbsp; '+s.date+' &nbsp; '+TIME_LABELS[s.time]+' <span style="color:#888">('+TIME_TIMES[s.time]+')</span> &nbsp; 📍'+s.loc;
    cont.appendChild(d);
  });
}

/* ── 마이페이지 ── */
function showMypage(){
  document.getElementById('mypage-title').textContent=S.cls+'반 '+S.grp+'조 시행 체크';
  document.getElementById('mypage-sub').textContent='각 회차의 시행 여부와 참여 학생을 확인해주세요';
  showView('view-mypage');
  renderMypage();
}

function goMypage(){
  const data=schedules[myKey()];
  if(!data) return;
  S.sessions=JSON.parse(JSON.stringify(data.sessions));
  S.names=data.names;
  showMypage();
}

function renderMypage(){
  const cont=document.getElementById('mypage-sessions'); cont.innerHTML='';
  const members=S.names.split(/[,\n]/).map(function(n){ return n.trim(); }).filter(Boolean);
  S.sessions.forEach(function(sess,si){
    const card=document.createElement('div');
    card.className='card'; card.style.marginBottom='12px';
    let inner='<div class="section-label" style="margin-bottom:8px">'+(si+1)+'회차</div>';
    if(!sess.date){ inner+='<p style="font-size:13px;color:#aaa">아직 일정이 없습니다</p>'; card.innerHTML=inner; cont.appendChild(card); return; }
    inner+='<div style="font-size:15px;font-weight:700;margin-bottom:2px">'+sess.date+'</div>';
    inner+='<div style="font-size:13px;color:#555;margin-bottom:12px">'+TIME_LABELS[sess.time]+' ('+TIME_TIMES[sess.time]+') &nbsp;📍'+sess.loc+'</div>';
    inner+='<div class="section-label">시행 여부</div>';
    inner+='<div class="exec-row"><button class="exec-btn'+(sess.executed===true?' yes':'')+'" data-si="'+si+'" data-val="true">✔ 시행 완료</button><button class="exec-btn'+(sess.executed===false?' no':'')+'" data-si="'+si+'" data-val="false">✕ 미시행</button></div>';
    if(members.length>0){
      const cnt=sess.presentMembers?sess.presentMembers.length:0;
      inner+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;margin-bottom:4px"><div class="section-label" style="margin-bottom:0">참여 학생 체크</div><div style="display:flex;gap:8px"><button class="check-all-btn" data-si="'+si+'" style="background:none;border:none;font-size:12px;color:#185FA5;cursor:pointer;font-family:inherit;font-weight:700">전체선택</button><button class="uncheck-all-btn" data-si="'+si+'" style="background:none;border:none;font-size:12px;color:#888;cursor:pointer;font-family:inherit;font-weight:700">전체해제</button></div></div>';
      inner+='<div class="member-check-list">';
      members.forEach(function(m,mi){
        const checked=sess.presentMembers&&sess.presentMembers.includes(m);
        inner+='<div class="member-check-item'+(checked?' checked':'')+'" data-si="'+si+'" data-mi="'+mi+'"><input type="checkbox" '+(checked?'checked':'')+' onclick="event.stopPropagation()"><span>'+m+'</span></div>';
      });
      inner+='</div><div class="attend-count">'+cnt+'/'+members.length+'명 참여</div>';
    }
    card.innerHTML=inner;
    cont.appendChild(card);
  });
  cont.querySelectorAll('.exec-btn').forEach(function(btn){ btn.addEventListener('click',function(){ toggleExec(parseInt(this.dataset.si), this.dataset.val==='true'); }); });
  cont.querySelectorAll('.member-check-item').forEach(function(item){ item.addEventListener('click',function(){ toggleMember(parseInt(this.dataset.si), parseInt(this.dataset.mi)); }); });
  cont.querySelectorAll('.check-all-btn').forEach(function(btn){ btn.addEventListener('click',function(){ checkAll(parseInt(this.dataset.si)); }); });
  cont.querySelectorAll('.uncheck-all-btn').forEach(function(btn){ btn.addEventListener('click',function(){ uncheckAll(parseInt(this.dataset.si)); }); });
}

function toggleExec(si,val){ S.sessions[si].executed=S.sessions[si].executed===val?null:val; renderMypage(); }
function toggleMember(si,mi){
  const members=S.names.split(/[,\n]/).map(function(n){ return n.trim(); }).filter(Boolean);
  const name=members[mi];
  if(!S.sessions[si].presentMembers) S.sessions[si].presentMembers=[];
  const pm=S.sessions[si].presentMembers, idx=pm.indexOf(name);
  if(idx>=0) pm.splice(idx,1); else pm.push(name);
  renderMypage();
}
function checkAll(si){ S.sessions[si].presentMembers=S.names.split(/[,\n]/).map(function(n){ return n.trim(); }).filter(Boolean); renderMypage(); }
function uncheckAll(si){ S.sessions[si].presentMembers=[]; renderMypage(); }

async function saveMypage(){
  const key=myKey();
  if(!schedules[key]) return;
  schedules[key].sessions=JSON.parse(JSON.stringify(S.sessions));
  const ok=await apiSet(key, schedules[key]);
  if(ok) alert('저장되었습니다! ✅');
}

function editSchedule(){ showView('view-schedule'); document.getElementById('schedule-title').textContent=S.cls+'반 '+S.grp+'조 일정 수정'; document.getElementById('schedule-sub').textContent='수정할 회차의 날짜·시간·장소를 변경해주세요'; showStep('sessions'); }

function goHome(){
  showView('view-home'); S.cls=null; S.grp=null;
  document.querySelectorAll('.class-btn').forEach(function(b){ b.classList.remove('selected'); });
  document.getElementById('group-card').style.display='none';
  document.getElementById('btn-start').disabled=true;
}

function exportData(){
  let txt='학교폭력예방 캠페인 일정 현황\n'+'='.repeat(40)+'\n\n';
  for(let c=1;c<=9;c++) for(let g=1;g<=7;g++){
    const key=c+'-'+g, d=schedules[key];
    if(d){
      txt+='['+c+'반 '+g+'조] 조원: '+d.names+'\n';
      d.sessions.forEach(function(s,i){ txt+='  '+(i+1)+'회차: '+(s.date||'미정')+' '+(s.time?TIME_LABELS[s.time]+' ('+TIME_TIMES[s.time]+')':'')+' '+(s.loc?'📍'+s.loc:'')+'\n         시행여부: '+(s.executed===true?'✔ 시행완료':s.executed===false?'✕ 미시행':'—')+'\n'+(s.presentMembers&&s.presentMembers.length>0?'         참여학생: '+s.presentMembers.join(', ')+'\n':''); });
      txt+='\n';
    }
  }
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='캠페인일정.txt'; a.click();
}

})();
</script>
